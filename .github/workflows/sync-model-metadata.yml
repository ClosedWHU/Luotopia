name: Sync model metadata catalog

# Rebuilds the AI model metadata catalog from models.dev, OpenRouter and the
# Vercel AI Gateway and publishes it — with a freshly signed manifest — to R2.
#
# Neither the catalog nor the manifest is committed to git any more. The catalog
# is a ~137 KB gzip that never delta-compresses and changes whenever the upstream
# model landscape moves (in practice: daily), so versioning it in the repo added a
# blob and a bot commit every day. It now lives in R2 (bucket whu-sb-bucket, keys
# under hot-update/), served on Cloudflare by functions/hot-update/[[path]].ts and
# proxied from there by the EdgeOne/ESA mirrors. This job is the only writer.
#
# Flow: pull the published catalog + manifest from R2 (so the sync's change
# detection and the manifest's version continuity compare against what clients
# actually have), rebuild the catalog, regenerate + verify the signed manifest,
# push both back. When the model data is unchanged the sync leaves the catalog
# bytes alone, so generate() reproduces a byte-identical manifest and the two
# puts are idempotent no-ops — a quiet day writes the same objects and bumps
# nothing.
#
# Secrets required:
#   HOT_UPDATE_ED25519_PRIVATE_KEY  signs the manifest (same value as the
#                                   Cloudflare Production variable)
#   CLOUDFLARE_API_TOKEN            R2 read/write for whu-sb-bucket
#   CLOUDFLARE_ACCOUNT_ID           the account that owns the bucket

on:
  schedule:
    # 01:00 Asia/Shanghai
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-model-metadata
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_BUCKET: whu-sb-bucket

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pull what clients currently have, so change detection and manifest version
      # continuity compare against the published state rather than an empty tree.
      # Strict: if R2 is unreachable this fails loudly and the next run retries,
      # rather than regenerating against nothing and clobbering the live objects.
      - name: Fetch published catalog + manifest from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler r2 object get "$R2_BUCKET/hot-update/assets/model-metadata-catalog.json.gz" \
            --file=public/hot-update/assets/model-metadata-catalog.json.gz --remote
          npx wrangler r2 object get "$R2_BUCKET/hot-update/manifest.json" \
            --file=public/hot-update/manifest.json --remote

      - name: Rebuild the catalog
        run: node tools/sync-model-metadata.mjs

      - name: Regenerate and verify the signed manifest
        run: |
          npm run hot-update:generate
          npm run hot-update:verify
        env:
          HOT_UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.HOT_UPDATE_ED25519_PRIVATE_KEY }}

      - name: Publish catalog + manifest to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler r2 object put "$R2_BUCKET/hot-update/assets/model-metadata-catalog.json.gz" \
            --file=public/hot-update/assets/model-metadata-catalog.json.gz \
            --content-type=application/gzip --remote
          npx wrangler r2 object put "$R2_BUCKET/hot-update/manifest.json" \
            --file=public/hot-update/manifest.json \
            --content-type=application/json --remote
