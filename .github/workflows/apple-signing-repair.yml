name: Apple signing repair

# Regenerates the manual App Store provisioning profiles after entitlement or
# target changes (e.g. the iOS App Attest entitlement, the macOS packet tunnel
# target). The app repo's `signing_repair` lane first syncs the portal-side
# bundle-id capabilities, then runs Match with force. Manual dispatch only, so
# portal-mutating Match runs never happen by accident; same secret posture as
# the Apple jobs in app-release.yml (everything comes from the `testflight`
# environment, no fork-supplied code runs here).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "App repo git ref to run the repair lane from"
        required: false
        default: main

concurrency:
  group: apple-signing-repair
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Private repo the fastlane lanes are fetched from; same token resolution as
  # app-release.yml.
  APP_REPO: ClosedWHU/Luotopia-app

jobs:
  repair:
    name: Regenerate Store profiles
    runs-on: macos-26
    timeout-minutes: 30
    environment: testflight
    env:
      FASTLANE_SKIP_UPDATE_CHECK: "true"
      FASTLANE_OPT_OUT_USAGE: "true"
      FASTLANE_HIDE_CHANGELOG: "true"
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      APP_REPO_TOKEN: ${{ secrets.APP_REPO_TOKEN || secrets.CROSS_REPO_TOKEN }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
      MATCH_GIT_BRANCH: ${{ vars.MATCH_GIT_BRANCH || 'main' }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - name: Check configuration
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in APP_REPO_TOKEN MATCH_PASSWORD MATCH_GIT_URL APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Apple configuration: $name"
              exit 1
            fi
          done

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.APP_REPO }}
          token: ${{ env.APP_REPO_TOKEN }}
          ref: ${{ inputs.ref || 'main' }}
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Test release orchestration
        run: bundle exec ruby test/tool/apple_release_test.rb

      - name: Repair Store signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: bundle exec fastlane signing_repair
